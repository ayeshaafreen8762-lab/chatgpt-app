# Render Blueprint Specification for FastAPI Backend
#
# IMPORTANT: HF_API_KEY must be set manually in the Render Dashboard
# because GitHub secret scanning blocks pushing real API tokens in plaintext.
#
# Steps to set it:
# 1. Go to https://dashboard.render.com
# 2. Open the "omniai-backend" service → Environment tab
# 3. Add HF_API_KEY = hf_... (your Hugging Face token)
# 4. Click "Save Changes" — Render auto-redeploys.
services:
  - type: web
    name: omniai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: HF_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: DATABASE_URL
        value: sqlite:///./omni_ai.db
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000,https://chatgpt-app-1c53a.web.app,https://chatgpt-app-1c53a.firebaseapp.com"
